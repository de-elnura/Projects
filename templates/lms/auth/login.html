{% extends 'lms/base.html' %}

{% block title %}Kirish — EduQuiz / SkillUp{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white rounded-3xl border border-slate-200/90 p-8 shadow-xl space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-xl mx-auto shadow-lg shadow-indigo-600/30">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Hisobingizga Kiring</h1>
            <p class="text-xs text-slate-500">SkillUp platformasida darslaringizni davom ettiring</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Foydalanuvchi nomi (Username)</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" name="username" required autofocus placeholder="Login kiriting..."
                        class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 text-slate-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Parol</label>
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" name="password" required placeholder="Parolni kiriting..."
                        class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 text-slate-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-sm shadow-lg shadow-indigo-600/30 transition">
                Tizimga Kirish
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            Hali akkauntingiz yo'qmi?
            <a href="{% url 'register' %}" class="font-bold text-indigo-600 hover:underline">Hoziroq ro'yxatdan o'ting</a>
        </div>

    </div>
</div>
{% endblock %}
