{% extends 'base.html' %}

{% block title %}Tizimga Kirish — SkillUp / EduQuiz{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary-subtle text-primary d-inline-flex p-3 mb-2">
                        <i class="fa-solid fa-arrow-right-to-bracket fa-2x"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Tizimga Kirish</h3>
                    <p class="text-muted small">O'quv profilingizga kirib, darslarni davom ettiring</p>
                </div>

                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Foydalanuvchi nomi</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Parol</label>
                        {{ form.password }}
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2.5 fs-6 shadow-sm mb-3">
                        Kirish
                    </button>

                    <div class="text-center text-muted small">
                        Hisobingiz yo'qmi? <a href="{% url 'register' %}" class="fw-bold text-primary">Ro'yxatdan o'ting</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
