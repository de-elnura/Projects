<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtma berish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-[#fffafc] via-[#fff] to-[#f7f5ff] font-sans text-gray-800">

    <header class="bg-white/90 backdrop-blur-xl sticky top-0 z-40 border-b border-pink-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'home' %}" class="flex items-center gap-2.5">
                <span class="w-11 h-11 rounded-2xl bg-gradient-to-br from-[#7c3aed] to-[#ec4899] flex items-center justify-center text-white text-xl shadow-lg shadow-violet-100">
                    <i class="fa-solid fa-seedling"></i>
                </span>
                <span class="text-2xl font-black text-[#6d28d9] tracking-tight">
                    Elnura's <span class="text-rose-500">Flowers</span>
                </span>
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
        <div class="grid lg:grid-cols-[0.95fr_1.05fr] gap-6 items-start">
            <div class="bg-white rounded-[28px] border border-pink-100 shadow-sm p-6">
                <span class="inline-block text-[11px] font-bold uppercase tracking-[0.18em] text-[#7c3aed] bg-violet-50 px-3 py-1.5 rounded-full">Buyurtma</span>
                <h1 class="mt-3 text-3xl font-black text-gray-900">Yetkazib berishni rasmiylashtirish</h1>
                <div class="mt-6 bg-gradient-to-r from-[#fff1f2] to-[#f5f3ff] border border-pink-100 rounded-[22px] p-4">
                    <div class="flex items-center gap-3">
                        <div class="w-16 h-16 rounded-2xl overflow-hidden bg-gray-100">
                            <img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?w=400&auto=format&fit=crop&q=80" alt="flower" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <p class="text-xs font-bold uppercase tracking-[0.12em] text-gray-500">Tanlangan gul</p>
                            <p class="mt-1 text-lg font-black text-gray-900">{{ flower.title }}</p>
                        </div>
                    </div>

                    <div class="mt-4 space-y-2 text-sm text-gray-700">
                        <div class="flex justify-between gap-3">
                            <span>Narx:</span>
                            <span class="font-bold text-gray-900">{{ flower.price }} so'm</span>
                        </div>
                        <div class="flex justify-between gap-3">
                            <span>Yetkazib berish:</span>
                            <span class="font-bold text-emerald-600">{{ flower.delivery_time }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[28px] border border-pink-100 shadow-sm p-6">
                <form method="POST" class="space-y-4">
                    {% csrf_token %}

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Sizning ismingiz</label>
                        <input type="text" name="customer_name" placeholder="Ismingiz" required class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:border-[#7c3aed] focus:ring-2 focus:ring-violet-100 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Telefon raqamingiz</label>
                        <input type="tel" name="phone" placeholder="+998 90 123 45 67" required class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:border-[#7c3aed] focus:ring-2 focus:ring-violet-100 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Yetkazib berish manzili</label>
                        <textarea name="address" rows="3" placeholder="Shahar, ko'cha, uy raqami..." required class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:border-[#7c3aed] focus:ring-2 focus:ring-violet-100 outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Yetkazish vaqti</label>
                        <input type="text" name="delivery_time" placeholder="Masalan: Bugun soat 18:00 ga" required class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:border-[#7c3aed] focus:ring-2 focus:ring-violet-100 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Miqdor</label>
                        <input type="number" name="quantity" value="1" min="1" class="w-full border border-gray-200 rounded-2xl px-4 py-3 text-sm focus:border-[#7c3aed] focus:ring-2 focus:ring-violet-100 outline-none">
                    </div>

                    <button type="submit" class="w-full bg-gradient-to-r from-[#7c3aed] to-[#ec4899] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-violet-100 hover:opacity-95 transition">
                        Buyurtmani tasdiqlash <i class="fa-solid fa-check ml-2"></i>
                    </button>

                    <a href="{% url 'home' %}" class="block text-center text-sm font-bold text-gray-500 mt-3 hover:text-[#7c3aed] transition">
                        <i class="fa-solid fa-arrow-left mr-2"></i>Bosh sahifaga qaytish
                    </a>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
