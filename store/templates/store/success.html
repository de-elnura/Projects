<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyurtma qabul qilindi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-[#fffafc] via-[#fff] to-[#f7f5ff] font-sans text-gray-800">

    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="bg-white border border-pink-100 shadow-xl shadow-pink-50 rounded-[32px] p-8 md:p-10 max-w-lg w-full text-center">
            <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-[#7c3aed] to-[#ec4899] text-white text-3xl flex items-center justify-center shadow-lg shadow-violet-100">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1 class="mt-6 text-3xl font-black text-gray-900">Buyurtmangiz qabul qilindi!</h1>
            <p class="mt-3 text-sm text-gray-600 leading-7">
                Buyurtma raqami: <span class="font-black text-[#7c3aed]">#{{ order.id }}</span><br>
                Floristlarimiz gulni tanlab, tez orada yetkazib berishga tayyorlanadi.
            </p>

            <div class="mt-6 rounded-[22px] bg-gradient-to-r from-[#fff1f2] to-[#f5f3ff] border border-pink-100 p-4 text-left text-sm text-gray-700">
                <div class="flex justify-between gap-3">
                    <span>Gul:</span>
                    <span class="font-bold text-gray-900">{{ flower.title }}</span>
                </div>
                <div class="flex justify-between gap-3 mt-2">
                    <span>To'lov:</span>
                    <span class="font-bold text-gray-900">{{ flower.price }} so'm</span>
                </div>
            </div>

            <a href="{% url 'home' %}" class="inline-flex items-center justify-center mt-7 bg-gradient-to-r from-[#7c3aed] to-[#ec4899] text-white font-bold px-6 py-3.5 rounded-2xl shadow-lg shadow-violet-100 hover:opacity-95 transition">
                Bosh sahifaga qaytish
            </a>
        </div>
    </main>

</body>
</html>
